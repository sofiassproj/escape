<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f5ef">
<title>🌍 Escapadinha</title>

<style>
:root{
  --bg:#f7f5ef;
  --paper:#fffdf9;
  --ink:#17211b;
  --muted:#6c756e;
  --green:#315c4b;
  --green2:#477762;
  --cream:#efe8d9;
  --line:#e4dfd4;
  --orange:#d9864a;
  --blue:#477fa4;
  --shadow:0 18px 55px rgba(39,48,41,.10);
  --radius:24px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:
    radial-gradient(circle at 10% 0%,rgba(211,231,216,.55),transparent 28%),
    radial-gradient(circle at 90% 10%,rgba(241,221,188,.48),transparent 25%),
    var(--bg);
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,input,select{font:inherit}
button{cursor:pointer}
a{color:inherit}

header{
  position:sticky;
  top:0;
  z-index:50;
  backdrop-filter:blur(18px);
  background:rgba(247,245,239,.86);
  border-bottom:1px solid rgba(228,223,212,.8);
}

.nav{
  max-width:1240px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-weight:900;
  font-size:21px;
  text-decoration:none;
}

.navlinks{
  display:flex;
  gap:6px;
}

.navlinks button{
  border:0;
  background:transparent;
  padding:10px 13px;
  border-radius:14px;
  color:var(--muted);
}

.navlinks button:hover,
.navlinks button.active{
  background:#fff;
  color:var(--ink);
}

main{
  max-width:1240px;
  margin:auto;
  padding:28px 20px 110px;
}

.hero{
  min-height:540px;
  border-radius:36px;
  padding:55px;
  position:relative;
  overflow:hidden;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:40px;
  align-items:center;
  background:
    linear-gradient(110deg,rgba(29,53,43,.92),rgba(43,78,64,.72)),
    url("https://commons.wikimedia.org/wiki/Special:FilePath/Lisbon%20view.jpg");
  background-size:cover;
  background-position:center;
  color:white;
  box-shadow:var(--shadow);
}

.hero:after{
  content:"";
  position:absolute;
  inset:auto -100px -160px auto;
  width:430px;
  height:430px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
}

.hero-copy{position:relative;z-index:2}

.eyebrow{
  text-transform:uppercase;
  letter-spacing:.13em;
  font-size:12px;
  font-weight:800;
  opacity:.75;
}

h1{
  font-size:clamp(42px,6vw,76px);
  line-height:.96;
  margin:14px 0 20px;
  letter-spacing:-.055em;
}

.hero p{
  max-width:610px;
  font-size:18px;
  line-height:1.65;
  opacity:.9;
}

.planner{
  position:relative;
  z-index:2;
  background:rgba(255,255,255,.94);
  color:var(--ink);
  border:1px solid rgba(255,255,255,.5);
  border-radius:27px;
  padding:23px;
  box-shadow:0 25px 70px rgba(0,0,0,.18);
}

.planner h2{
  margin:0 0 15px;
  font-size:22px;
}

.formgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.field{
  position:relative;
}

.field.full{grid-column:1/-1}

.field label{
  display:block;
  font-size:11px;
  font-weight:800;
  color:var(--muted);
  margin:0 0 6px 3px;
  text-transform:uppercase;
  letter-spacing:.05em;
}

.field input,
.field select{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  border-radius:14px;
  padding:12px 13px;
  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:var(--green2);
  box-shadow:0 0 0 3px rgba(71,119,98,.12);
}

.primary{
  border:0;
  width:100%;
  padding:14px 17px;
  border-radius:15px;
  background:var(--green);
  color:white;
  font-weight:800;
  margin-top:12px;
}

.secondary{
  border:1px solid var(--line);
  background:white;
  color:var(--ink);
  padding:11px 14px;
  border-radius:14px;
  font-weight:700;
}

.section{
  margin-top:55px;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:20px;
  margin-bottom:18px;
}

.section-head h2{
  margin:0;
  font-size:30px;
  letter-spacing:-.03em;
}

.section-head p{
  margin:5px 0 0;
  color:var(--muted);
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.chip{
  border:1px solid var(--line);
  background:white;
  border-radius:999px;
  padding:9px 14px;
  font-weight:700;
}

.chip.active{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}

.discovery{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.discovery button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:20px;
  padding:20px;
  text-align:left;
  min-height:125px;
  transition:.2s;
}

.discovery button:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}

.discovery strong{
  display:block;
  font-size:18px;
  margin:8px 0 4px;
}

.discovery span{
  color:var(--muted);
  font-size:14px;
}

.dest-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.dest-card{
  min-height:300px;
  border-radius:25px;
  overflow:hidden;
  position:relative;
  background:#ddd;
  color:white;
  cursor:pointer;
}

.dest-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.dest-card:after{
  content:"";
  position:absolute;
  inset:35% 0 0;
  background:linear-gradient(transparent,rgba(0,0,0,.78));
}

.dest-info{
  position:absolute;
  z-index:2;
  left:18px;
  right:18px;
  bottom:17px;
}

.dest-info h3{
  margin:0 0 4px;
  font-size:22px;
}

.dest-info p{
  margin:0;
  opacity:.82;
}

.destination-header{
  border-radius:32px;
  overflow:hidden;
  min-height:430px;
  position:relative;
  background:#ddd;
  color:white;
}

.destination-header img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.destination-header:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.08));
}

.destination-content{
  position:relative;
  z-index:2;
  padding:55px;
  max-width:720px;
}

.destination-content h1{
  margin-bottom:12px;
}

.destination-actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:25px;
}

.white-btn{
  border:1px solid rgba(255,255,255,.45);
  background:rgba(255,255,255,.15);
  color:#fff;
  backdrop-filter:blur(10px);
  border-radius:14px;
  padding:11px 15px;
  font-weight:800;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px;
}

.info-card{
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
}

.info-icon{font-size:25px}
.info-card strong{
  display:block;
  margin:9px 0 4px;
}

.info-card p{
  margin:0 0 10px;
  color:var(--muted);
  font-size:14px;
}

.place-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.place-card{
  background:white;
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.place-photo{
  height:220px;
  background:#e7e3d8;
  overflow:hidden;
  position:relative;
}

.place-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.verified{
  position:absolute;
  top:12px;
  left:12px;
  background:rgba(255,255,255,.92);
  color:var(--green);
  border-radius:999px;
  padding:7px 10px;
  font-size:11px;
  font-weight:900;
}

.place-body{
  padding:17px;
}

.place-body h3{
  margin:0 0 6px;
  font-size:19px;
}

.place-meta{
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
  min-height:42px;
}

.place-actions{
  display:flex;
  gap:7px;
  margin-top:13px;
}

.place-actions button,
.place-actions a{
  flex:1;
  text-align:center;
  text-decoration:none;
  border:1px solid var(--line);
  background:white;
  padding:9px 8px;
  border-radius:11px;
  font-weight:750;
  font-size:13px;
}

.place-actions .open{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}

.source-note{
  font-size:11px;
  color:#7d857e;
  margin-top:10px;
}

.weather-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.weather-card{
  background:white;
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px;
}

.weather-temp{
  font-size:38px;
  font-weight:900;
}

.weather-details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:14px;
  font-size:13px;
  color:var(--muted);
}

.pack{
  background:#eef2ec;
  border-radius:27px;
  padding:25px;
}

.pack-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.progress{
  height:10px;
  border-radius:999px;
  background:#d9ded8;
  overflow:hidden;
}

.progress span{
  display:block;
  height:100%;
  width:0;
  background:var(--green);
  transition:.3s;
}

.pack-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:17px;
}

.pack-item{
  background:white;
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px;
  display:flex;
  align-items:flex-start;
  gap:10px;
}

.pack-item input{
  margin-top:4px;
  accent-color:var(--green);
}

.pack-item small{
  display:block;
  color:var(--muted);
  line-height:1.45;
  margin-top:4px;
}

.mapbox{
  min-height:370px;
  background:
    linear-gradient(135deg,#edf0e9 25%,transparent 25%) 0 0/45px 45px,
    linear-gradient(45deg,#e7ebe3 25%,transparent 25%) 0 0/45px 45px,
    #f3f2ec;
  border-radius:28px;
  border:1px solid var(--line);
  position:relative;
  overflow:hidden;
}

.map-center{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}

.map-center .pin{
  font-size:48px;
}

.travel-bar{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  padding:15px;
  background:white;
  border:1px solid var(--line);
  border-radius:19px;
  margin-top:15px;
}

.passport{
  background:
    radial-gradient(circle at 15% 20%,rgba(255,255,255,.12),transparent 20%),
    #234b3d;
  color:white;
  border-radius:30px;
  padding:30px;
  min-height:250px;
}

.stamps{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:20px;
}

.stamp{
  width:105px;
  height:105px;
  border:2px dashed rgba(255,255,255,.5);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:10px;
  font-size:12px;
  transform:rotate(-5deg);
}

.empty{
  padding:35px;
  background:white;
  border:1px dashed #cfc8b9;
  border-radius:22px;
  color:var(--muted);
  text-align:center;
}

.loading{
  padding:55px 20px;
  text-align:center;
  color:var(--muted);
}

.plane{
  display:inline-block;
  font-size:35px;
  animation:fly 2.4s ease-in-out infinite;
}

@keyframes fly{
  0%{transform:translateX(-50px) translateY(8px) rotate(-8deg)}
  50%{transform:translateX(50px) translateY(-10px) rotate(5deg)}
  100%{transform:translateX(100px) translateY(-25px) rotate(8deg)}
}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:rgba(19,27,22,.58);
  backdrop-filter:blur(8px);
}

.modal.open{display:flex}

.modal-box{
  width:min(850px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fffdf9;
  border-radius:27px;
  box-shadow:0 30px 100px rgba(0,0,0,.25);
}

.modal-head{
  position:sticky;
  top:0;
  z-index:2;
  background:#fffdf9;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 22px;
  border-bottom:1px solid var(--line);
}

.modal-head button{
  border:0;
  background:#f0eee8;
  width:38px;
  height:38px;
  border-radius:50%;
}

.modal-body{padding:23px}

.gallery{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  grid-template-rows:170px 170px;
  gap:8px;
  margin-bottom:20px;
}

.gallery img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:13px;
}

.gallery img:first-child{
  grid-row:1/3;
}

.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.detail{
  padding:15px;
  border:1px solid var(--line);
  border-radius:15px;
  background:white;
}

.detail strong{
  display:block;
  margin-bottom:5px;
}

.detail span{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

footer{
  text-align:center;
  padding:40px 20px 100px;
  color:var(--muted);
  font-size:13px;
}

.mobile-nav{
  display:none;
}

@media(max-width:900px){
  .hero{
    grid-template-columns:1fr;
    padding:30px;
  }

  .dest-grid{grid-template-columns:repeat(2,1fr)}
  .discovery{grid-template-columns:repeat(2,1fr)}
  .info-grid{grid-template-columns:repeat(2,1fr)}
  .place-grid{grid-template-columns:repeat(2,1fr)}
  .weather-grid{grid-template-columns:1fr 1fr}
}

@media(max-width:650px){
  header{display:none}

  main{
    padding:13px 13px 95px;
  }

  .hero{
    border-radius:25px;
    min-height:auto;
    padding:25px 18px;
  }

  h1{font-size:46px}

  .formgrid,
  .pack-list,
  .detail-grid{
    grid-template-columns:1fr;
  }

  .dest-grid,
  .place-grid,
  .info-grid,
  .weather-grid,
  .discovery{
    grid-template-columns:1fr;
  }

  .destination-content{
    padding:30px 22px;
  }

  .gallery{
    grid-template-columns:1fr 1fr;
    grid-template-rows:180px 100px;
  }

  .gallery img:first-child{
    grid-column:1/3;
    grid-row:auto;
  }

  .mobile-nav{
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:70;
    background:rgba(255,253,249,.95);
    backdrop-filter:blur(18px);
    border-top:1px solid var(--line);
    justify-content:space-around;
    padding:9px 4px calc(9px + env(safe-area-inset-bottom));
  }

  .mobile-nav button{
    border:0;
    background:none;
    color:var(--muted);
    font-size:11px;
    font-weight:800;
  }

  .mobile-nav span{
    display:block;
    font-size:20px;
  }
}
</style>
</head>

<body>

<header>
  <nav class="nav">
    <a class="logo" href="#" onclick="showHome();return false">🌍 Escapadinha</a>

    <div class="navlinks">
      <button onclick="showHome()">Início</button>
      <button onclick="scrollToId('discover')">Explorar</button>
      <button onclick="openPassport()">🎟️ Passaporte</button>
      <button onclick="openTravelMode()">✈️ Viagem</button>
    </div>
  </nav>
</header>

<main id="app"></main>

<div class="mobile-nav">
  <button onclick="showHome()"><span>⌂</span>Início</button>
  <button onclick="scrollToId('discover')"><span>🧭</span>Explorar</button>
  <button onclick="openMap()"><span>🗺️</span>Mapa</button>
  <button onclick="openTravelMode()"><span>✈️</span>Viagem</button>
  <button onclick="openPassport()"><span>🎟️</span>Passaporte</button>
</div>

<div class="modal" id="modal" onclick="closeModal(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-head">
      <strong id="modalTitle">Escapadinha</strong>
      <button onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>

============================================================ */

function escapeHTML(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

async function fetchJSON(url,options={},timeout=12000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);

  try{
    const response=await fetch(url,{
      ...options,
      signal:controller.signal
    });

    if(!response.ok) throw new Error("HTTP "+response.status);
    return await response.json();
  }finally{
    clearTimeout(timer);
  }
}

function cacheGet(key,maxAge){
  try{
    const item=JSON.parse(sessionStorage.getItem(key));
    if(!item) return null;
    if(Date.now()-item.time>maxAge) return null;
    return item.data;
  }catch{
    return null;
  }
}

function cacheSet(key,data){
  try{
    sessionStorage.setItem(key,JSON.stringify({
      time:Date.now(),
      data
    }));
  }catch{}
}

async function getDestinationImage(dest){
  const key="destination-image:"+dest.name;
  const cached=cacheGet(key,1000*60*60*24);
  if(cached) return cached;

  try{
    const search=await fetchJSON(
      `https://commons.wikimedia.org/w/api.php?action=query&generator=geosearch&ggsprimary=all&ggsnamespace=6&ggsradius=6000&ggscoord=${dest.lat}|${dest.lon}&ggslimit=8&prop=imageinfo&iiprop=url&iiurlwidth=1200&format=json&origin=*`,
      {},
      10000
    );

    const pages=Object.values(search.query?.pages||{});

    const candidate=pages.find(p=>{
      const title=(p.title||"").toLowerCase();
      return !/(portrait|selfie|person|people|crowd|actor|actress)/i.test(title);
    });

    const url=candidate?.imageinfo?.[0]?.thumburl||
             candidate?.imageinfo?.[0]?.url;

    if(url){
      cacheSet(key,url);
      return url;
    }
  }catch{}

  try{
    const wiki=await fetchJSON(
      `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(dest.name)}`,
      {},
      8000
    );

    const url=wiki.thumbnail?.source||wiki.originalimage?.source;
    if(url){
      cacheSet(key,url);
      return url;
    }
  }catch{}

  return null;
}

async function planTrip(event){
  event.preventDefault();

  const raw=document.getElementById("destinationInput").value.trim();
  if(!raw){
    alert("Escolhe um destino primeiro.");
    return;
  }

  const found=findDestination(raw);

  state.planner={
    nationality:document.getElementById("nationalityInput").value.trim()||"Portugal",
    people:Number(document.getElementById("peopleInput").value)||2,
    start:document.getElementById("startDate").value,
    end:document.getElementById("endDate").value,
    budget:document.getElementById("budget").value,
    type:document.getElementById("tripType").value,
    lodging:document.getElementById("lodging").value
  };

  let destination=found;

  if(!destination){
    showLoading("A localizar o destino…");

    const geo=await geocodeDestination(raw);

    if(!geo){
      alert("Não consegui localizar esse destino com dados geográficos reais.");
      showHome();
      return;
    }

    destination={
      name:geo.name||raw,
      country:geo.display_name?.split(",").slice(-1)[0]?.trim()||"",
      flag:"📍",
      lat:Number(geo.lat),
      lon:Number(geo.lon),
      cc:geo.address?.country_code?.toUpperCase()||""
    };
  }

  await openDestination(destination);
}

function findDestination(value){
  const normalized=value.toLowerCase();

  return DESTINATIONS.find(d=>{
    const full=(d[0]+" "+d[1]).toLowerCase();
    return full===normalized ||
           d[0].toLowerCase()===normalized ||
           full.includes(normalized);
  })||null;
}

async function geocodeDestination(query){
  try{
    const data=await fetchJSON(
      `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&q=${encodeURIComponent(query)}`,
      {headers:{"Accept-Language":"pt-PT"}},
      10000
    );

    return data[0]||null;
  }catch{
    return null;
  }
}

    .filter(x=>x.status==="fulfilled" && x.value)

}

async function getCountryMeta(cc,countryName){
  const key="country-meta:"+cc;
  const cached=cacheGet(key,1000*60*60*24*30);
  if(cached) return cached;

  if(!cc) return fallbackCountryMeta(countryName);

  try{
    const data=await fetchJSON(
      `https://restcountries.com/v3.1/alpha/${encodeURIComponent(cc)}?fields=name,capital,currencies,timezones,languages,cca2`,
      {},
      9000
    );

    const currency=data.currencies?
      Object.entries(data.currencies)[0]:
      null;

    const meta={
      name:data.name?.common||countryName,
      capital:(data.capital||[]).join(", "),
      languages:Object.values(data.languages||{}),
      currency:currency?
        [currency[1]?.name||currency[0],currency[0],currency[1]?.symbol||""]:
        CURRENCY[cc]||["Moeda local", "", ""],
      timezones:data.timezones||[],
      cc:data.cca2||cc
    };

    cacheSet(key,meta);
    return meta;
  }catch{
    return fallbackCountryMeta(countryName,cc);
  }
}

function fallbackCountryMeta(country,cc){
  return {
    name:country,
    capital:"",
    languages:LANGUAGE_PACKS[cc]?.names||[],
    currency:CURRENCY[cc]||["Moeda local","",""],
    timezones:[],
    cc:cc||""
  };
}

async function getWeatherZones(dest){
  const key="zones:"+dest.name+":"+dest.country;
  const cached=cacheGet(key,1000*60*60*6);

  if(cached) return cached;

  const zones=[];

  try{
    const data=await fetchJSON(
      `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=15&dedupe=1&addressdetails=1&namedetails=1&q=${encodeURIComponent(dest.name+", "+dest.country)}`,
      {headers:{"Accept-Language":"pt-PT"}},
      10000
    );

    const seen=new Set();

    for(const item of data){
      const address=item.address||{};
      const name=
        item.name||
        address.city||
        address.town||
        address.village||
        address.suburb||
        address.neighbourhood;

      const type=[
        "city","town","village","municipality",
        "suburb","neighbourhood","quarter","district"
      ];

      if(!name || !type.includes(item.type)) continue;

      const keyName=name.toLowerCase();

      if(seen.has(keyName)) continue;
      seen.add(keyName);

      zones.push({
        name,
        lat:Number(item.lat),
        lon:Number(item.lon),
        type:item.type
      });

      if(zones.length>=8) break;
    }
  }catch{}

  if(!zones.length){
    zones.push({
      name:dest.name,
      lat:dest.lat,
      lon:dest.lon,
      type:"city"
    });
  }

  cacheSet(key,zones);
  return zones;
}

async function getWeather(zone){
  const key=`weather:${zone.lat.toFixed(3)}:${zone.lon.toFixed(3)}`;
  const cached=cacheGet(key,1000*60*15);
  if(cached) return cached;

  const urls=[
    `https://api.open-meteo.com/v1/forecast?latitude=${zone.lat}&longitude=${zone.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m&hourly=precipitation_probability&timezone=auto`,
    `https://api.open-meteo.com/v1/ecmwf?latitude=${zone.lat}&longitude=${zone.lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m&hourly=precipitation_probability&timezone=auto`
  ];

  for(const url of urls){
    try{
      const data=await fetchJSON(url,{},10000);

      const result={
        ...zone,
        current:data.current,
        hourly:data.hourly,
        timezone:data.timezone,
        source:"Open-Meteo"
      };

      cacheSet(key,result);
      return result;
    }catch{}
  }

  return null;
}

const OVERPASS=[
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
  "https://overpass.private.coffee/api/interpreter",
  "https://overpass.nchc.org.tw/api/interpreter"
];

function categoryQuery(category,lat,lon,radius=10000){
  const around=`(around:${radius},${lat},${lon})`;

  if(category==="restaurant"){
    return `
      nwr["amenity"="restaurant"]${around};
    `;
  }

  if(category==="cafe"){
    return `
      nwr["amenity"="cafe"]${around};
    `;
  }

  if(category==="hotel"){
    return `
      nwr["tourism"="hotel"]${around};
    `;
  }

  if(category==="hostel"){
    return `
      nwr["tourism"="hostel"]${around};
    `;
  }

  if(category==="apartment"){
    return `
      nwr["tourism"="apartment"]${around};
      nwr["tourism"="guest_house"]${around};
    `;
  }

  return `
    nwr["tourism"="attraction"]${around};
    nwr["tourism"="museum"]${around};
    nwr["tourism"="gallery"]${around};
    nwr["historic"="monument"]${around};
    nwr["historic"="castle"]${around};
    nwr["historic"="archaeological_site"]${around};
    nwr["leisure"="park"]${around};
    nwr["natural"="beach"]${around};
    nwr["tourism"="viewpoint"]${around};
  `;
}

async function queryOverpass(category){
  const d=state.destination;

  const cacheKey=
    `places:${category}:${d.name}:${d.lat.toFixed(3)}:${d.lon.toFixed(3)}`;

  const cached=cacheGet(cacheKey,1000*60*60*4);

  if(cached) return cached;

  const query=`
    [out:json][timeout:20];
    (
      ${categoryQuery(category,d.lat,d.lon,12000)}
    );
    out center tags;
  `;

  const requests=OVERPASS.map(endpoint=>
    fetchJSON(
      endpoint+"?data="+encodeURIComponent(query),
      {},
      22000
    )
  );

  try{
    const result=await Promise.any(requests);
    const elements=result.elements||[];
    cacheSet(cacheKey,elements);
    return elements;
  }catch{
    return [];
  }
}

function osmPlace(element,category){
  const tags=element.tags||{};
  const lat=element.lat??element.center?.lat;
  const lon=element.lon??element.center?.lon;

  if(!tags.name || lat==null || lon==null) return null;

  const address=[
    tags["addr:housenumber"],
    tags["addr:street"],
    tags["addr:postcode"],
    tags["addr:city"]
  ].filter(Boolean).join(", ");

  return {
    osmId:element.type+"/"+element.id,
    id:element.id,
    osmType:element.type,
    category,
    name:tags.name,
    lat:Number(lat),
    lon:Number(lon),
    address,
    website:tags.website||tags["contact:website"]||"",
    phone:tags.phone||tags["contact:phone"]||"",
    opening_hours:tags.opening_hours||"",
    cuisine:tags.cuisine||"",
    description:tags.description||"",
    image:tags.image||"",
    wikidata:tags.wikidata||"",
    wikipedia:tags.wikipedia||"",
    commons:tags.wikimedia_commons||"",
    wheelchair:tags.wheelchair||"",
    outdoor:tags.outdoor_seating||"",
    takeaway:tags.takeaway||"",
    delivery:tags.delivery||"",
    reservation:tags.reservation||"",
    operator:tags.operator||"",
    brand:tags.brand||"",
    maps:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(tags.name+" "+address)}`
  };
}

/* ------------------------------------------------------------
   IDENTIDADE / FOTOGRAFIA
------------------------------------------------------------ */

function normalizeName(s){
  return String(s||"")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[^\p{L}\p{N}]+/gu," ")
    .trim();
}

function namesRelated(a,b){
  const A=normalizeName(a);
  const B=normalizeName(b);

  if(!A||!B) return false;
  if(A===B) return true;
  if(A.includes(B)||B.includes(A)) return true;

  const aw=A.split(" ").filter(x=>x.length>2);
  const bw=B.split(" ").filter(x=>x.length>2);

  if(!aw.length||!bw.length) return false;

  const common=aw.filter(x=>bw.includes(x)).length;
  return common>=Math.min(2,aw.length,bw.length);
}

function safeImageUrl(url){
  if(!url) return null;

  try{
    const u=new URL(url);

    if(!/^https?:$/.test(u.protocol)) return null;

    if(/\.(jpg|jpeg|png|webp)(\?|$)/i.test(u.pathname)){
      return u.href;
    }

    return u.href;
  }catch{
    return null;
  }
}

function imageLooksPersonFocused(title=""){
  return /(portrait|selfie|person|people|crowd|man|woman|men|women|actor|actress|tourist|traveler|traveller)/i
    .test(title);
}

/* 
  Procura imagem explicitamente associada ao objeto.
  A ordem é deliberadamente conservadora.
*/
async function getVerifiedPlaceImages(place){
  const cacheKey="verified-images:"+place.osmId;
  const cached=cacheGet(cacheKey,1000*60*60*24);
  if(cached?.length) return cached;

  const results=[];

  /* 1. imagem diretamente no OSM */
  if(place.image){
    const direct=safeImageUrl(place.image);
    if(direct){
      results.push({
        url:direct,
        source:"OpenStreetMap — image",
        confidence:"direct"
      });
    }
  }

  /* 2. Wikimedia Commons explicitamente associado no OSM */
  if(place.commons){
    const commonsName=
      place.commons
        .replace(/^Category:/i,"")
        .trim();

    try{
      const data=await fetchJSON(
        `https://commons.wikimedia.org/w/api.php?action=query&generator=categorymembers&gcmtitle=${encodeURIComponent("Category:"+commonsName)}&gcmtype=file&gcmlimit=8&prop=imageinfo&iiprop=url&iiurlwidth=1000&format=json&origin=*`,
        {},
        9000
      );

      for(const p of Object.values(data.query?.pages||{})){
        const info=p.imageinfo?.[0];
        const url=safeImageUrl(info?.thumburl||info?.url);

        if(url && !imageLooksPersonFocused(p.title)){
          results.push({
            url,
            source:"Wikimedia Commons — categoria associada",
            confidence:"explicit"
          });
        }
      }
    }catch{}
  }

  /* 3. Wikidata -> Commons */
  if(place.wikidata){
    try{
      const qid=place.wikidata.replace(/^Q/i,"Q");

      const data=await fetchJSON(
        `https://www.wikidata.org/wiki/Special:EntityData/${encodeURIComponent(qid)}.json`,
        {},
        9000
      );

      const entity=data.entities?.[qid];
      const claims=entity?.claims||{};

      /*
        P18 = imagem
      */
      const p18=claims.P18?.[0]?.mainsnak?.datavalue?.value;

      if(p18){
        const filename=String(p18).replace(/ /g,"_");

        try{
          const media=await fetchJSON(
            `https://commons.wikimedia.org/w/api.php?action=query&titles=File:${encodeURIComponent(filename)}&prop=imageinfo&iiprop=url&iiurlwidth=1000&format=json&origin=*`,
            {},
            9000
          );

          const page=Object.values(media.query?.pages||{})[0];
          const info=page?.imageinfo?.[0];
          const url=safeImageUrl(info?.thumburl||info?.url);

          if(url){
            results.push({
              url,
              source:"Wikidata → Wikimedia Commons",
              confidence:"entity"
            });
          }
        }catch{}
      }
    }catch{}
  }

  /* 4. Wikipedia indicada explicitamente pelo OSM */
  if(place.wikipedia){
    try{
      const page=place.wikipedia.split(":").slice(1).join(":")||place.wikipedia;

      const wiki=await fetchJSON(
        `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(page)}`,
        {},
        9000
      );

      const url=safeImageUrl(
        wiki.originalimage?.source||
        wiki.thumbnail?.source
      );

      if(url){
        results.push({
          url,
          source:"Wikipedia — página associada",
          confidence:"entity"
        });
      }
    }catch{}
  }

  /* 
     5. Pesquisa Commons por nome.
     NÃO é aceite cegamente.
     Só passa se houver correspondência forte no título.
  */
  if(results.length<3){
    try{
      const search=await fetchJSON(
        `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent('"'+place.name+'"')}&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url&iiurlwidth=1000&format=json&origin=*`,
        {},
        9000
      );

      for(const p of Object.values(search.query?.pages||{})){
        const title=(p.title||"").replace(/^File:/i,"");

        if(!namesRelated(place.name,title)) continue;
        if(imageLooksPersonFocused(title)) continue;

        const info=p.imageinfo?.[0];
        const url=safeImageUrl(info?.thumburl||info?.url);

        if(url){
          results.push({
            url,
            source:"Wikimedia Commons — nome correspondente",
            confidence:"name"
          });
        }
      }
    }catch{}
  }

  /* remover duplicados */
  const unique=[];
  const seen=new Set();

  for(const item of results){
    if(!seen.has(item.url)){
      seen.add(item.url);
      unique.push(item);
    }
  }

  /*
     Só guardar quando há pelo menos uma associação aceitável.
     Para restaurantes/cafés, uma imagem genérica geográfica nunca
     é adicionada.
  */
  if(unique.length){
    cacheSet(cacheKey,unique.slice(0,6));
  }

  return unique.slice(0,6);
}

async function enrichPlace(place){
  const images=await getVerifiedPlaceImages(place);

  /*
     REGRA:
     Sem imagem associada, não mostramos o lugar na grelha.
  */
  if(!images.length) return null;

  return {
    ...place,
    images,
    verifiedImage:true
  };
}

async function loadCategory(category){
  const raw=await queryOverpass(category);

  const candidates=raw
    .map(x=>osmPlace(x,category))
    .filter(Boolean);

  /*
     Diversidade:
     não queremos os 15 primeiros resultados do OSM.
     Ordenamos por qualidade de dados e depois distância.
  */
  const unique=[];
  const seen=new Set();

  for(const p of candidates){
    const key=normalizeName(p.name);

    if(seen.has(key)) continue;

    seen.add(key);
    unique.push(p);
  }

  unique.sort((a,b)=>{
    const score=p=>(
      (p.wikidata?8:0)+
      (p.commons?7:0)+
      (p.wikipedia?5:0)+
      (p.image?5:0)+
      (p.website?3:0)+
      (p.address?2:0)+
      (p.opening_hours?1:0)
    );

    return score(b)-score(a);
  });

  const enriched=[];
  const hardCap=category==="attraction"?35:45;

  for(let i=0;i<Math.min(unique.length,hardCap);i++){
    try{
      const place=await enrichPlace(unique[i]);

      if(place){
        enriched.push(place);
      }

      /*
        Chegamos a 12-15 lugares completos.
      */
      if(enriched.length>=15) break;
    }catch{}
  }

  return enriched;
}

async function loadAllPlaceCategories(){
  const categories=[
    "restaurant",
    "cafe",
    "attraction",
    "hotel",
    "hostel",
    "apartment"
  ];

  /*
     As categorias são independentes.
     Se uma falhar, as outras continuam.
  */
  const results=await Promise.allSettled(
    categories.map(loadCategory)
  );

  categories.forEach((category,i)=>{
    state.places[category]=
      results[i].status==="fulfilled"?
      results[i].value:
      [];
  });

  renderPlaceCategory("restaurant");
  renderPlaceCategory("cafe");
  renderPlaceCategory("attraction");
  renderLodging();
}

async function reloadCategory(category){
  if(!state.destination) return;

  const id={
    restaurant:"restaurantGrid",
    cafe:"cafeGrid",
    attraction:"attractionGrid"
  }[category];

  const container=document.getElementById(id);

  if(container){
    container.innerHTML=loadingPlaces();
  }

  const cacheKey=
    `places:${category}:${state.destination.name}:${state.destination.lat.toFixed(3)}:${state.destination.lon.toFixed(3)}`;

  try{sessionStorage.removeItem(cacheKey)}catch{}

  state.places[category]=await loadCategory(category);
  renderPlaceCategory(category);
}

function openPlace(place){
  const images=place.images||[];

  const gallery=images.length?
    `<div class="gallery">
      ${images.map((img,i)=>`
        <img src="${escapeHTML(img.url)}"
             alt="${escapeHTML(place.name)} — fotografia ${i+1}">
      `).join("")}
    </div>`:
    "";

  const details=[];

  if(place.address) details.push(["📍 Morada",place.address]);
  if(place.cuisine) details.push(["🍴 Tipo/cozinha",place.cuisine.replace(/;/g,", ")]);
  if(place.opening_hours) details.push(["🕐 Horário",place.opening_hours]);
  if(place.phone) details.push(["☎️ Telefone",place.phone]);
  if(place.website) details.push(["🌐 Website",place.website]);
  if(place.wheelchair) details.push(["♿ Acessibilidade",place.wheelchair]);
  if(place.outdoor) details.push(["🌿 Exterior",place.outdoor]);
  if(place.takeaway) details.push(["🥡 Takeaway",place.takeaway]);
  if(place.delivery) details.push(["🛵 Entrega",place.delivery]);
  if(place.reservation) details.push(["📅 Reservas",place.reservation]);

  openModal(
    `${ICONS[place.category]||"📍"} ${place.name}`,
    `
      ${gallery}

      <p>
        <strong>✓ Fotografia associada ao lugar</strong><br>
        <span style="color:var(--muted)">
          A aplicação só mostrou este local depois de encontrar
          uma associação verificável entre o lugar e a fotografia.
        </span>
      </p>

      <div class="detail-grid">
        ${details.map(d=>`
          <div class="detail">
            <strong>${escapeHTML(d[0])}</strong>
            <span>${escapeHTML(d[1])}</span>
          </div>
        `).join("")}
      </div>

      <div class="travel-bar">
        <a class="secondary"
           href="${escapeHTML(place.maps)}"
           target="_blank"
           rel="noopener">
          🗺️ Abrir no mapa
        </a>

        ${place.website?
          `<a class="secondary"
              href="${escapeHTML(normalizeWebsite(place.website))}"
              target="_blank"
              rel="noopener">
             🌐 Website
           </a>`:""}

        <button class="secondary"
                onclick='toggleFavorite(${JSON.stringify(place).replace(/'/g,"&#39;")})'>
          ${isFavorite(place.osmId)?"❤️ Guardado":"♡ Guardar"}
        </button>
      </div>

      <p class="source-note">
        Fontes da imagem: ${escapeHTML(
          [...new Set(images.map(x=>x.source))].join(" · ")
        )}
      </p>
    `
  );
}

function normalizeWebsite(url){
  if(/^https?:\/\//i.test(url)) return url;
  return "https://"+url;
}

function renderWeatherCards(){
  if(!state.weather.length){
    return `
      <div class="empty" style="grid-column:1/-1">
        Não foi possível obter dados meteorológicos neste momento.
      </div>`;
  }

  return state.weather.map(w=>{
    const c=w.current;
    const desc=WMO[c?.weather_code]||"Condição meteorológica";

    const rain=firstRainProbability(w);

    return `
      <article class="weather-card">
        <div class="eyebrow">${escapeHTML(w.name)}</div>
        <div class="weather-temp">
          ${c?.temperature_2m!=null?
            Math.round(c.temperature_2m)+"°C":
            "—"}
        </div>

        <strong>${escapeHTML(desc)}</strong>

        <div style="color:var(--muted);margin-top:4px">
          Sensação ${c?.apparent_temperature!=null?
            Math.round(c.apparent_temperature)+"°C":"—"}
        </div>

        <div class="weather-details">
          <span>💧 ${c?.relative_humidity_2m??"—"}%</span>
          <span>🌧️ ${rain!=null?rain+"%":"—"}</span>
          <span>💨 ${c?.wind_speed_10m??"—"} km/h</span>
          <span>☁️ ${c?.cloud_cover??"—"}%</span>
        </div>
      </article>`;
  }).join("");
}

function firstRainProbability(w){
  const arr=w.hourly?.precipitation_probability;
  if(!arr?.length) return null;

  return arr[0];
}

      </p>

      <div class="weather-grid">

      </div>
    `
  );
}

function tripDays(){
  const s=state.planner.start;
  const e=state.planner.end;

  if(!s||!e) return 3;

  const a=new Date(s);
  const b=new Date(e);
  const days=Math.ceil((b-a)/86400000);

  return Math.max(1,Math.min(days,60));
}

          </p>

        <button class="secondary" onclick="openPacking()">

        </button>

function packingExplanation(f){
  const parts=[];

  if(f.min!==null) parts.push(`mín. ${Math.round(f.min)}°C`);
  if(f.max!==null) parts.push(`máx. ${Math.round(f.max)}°C`);
  if(f.rain!==null) parts.push(`chuva até ${Math.round(f.rain)}%`);
  parts.push(`${f.days} dia(s)`);

  return "Preparada com base em "+parts.join(" · ")+".";
}

function openPacking(){
  if(!state.destination){
    alert("Escolhe primeiro um destino.");
    return;
  }

  const data=getPackingRecommendations();
  const saved=getPackingState();

  openModal(
    "🧳 Preparar a mala",
    `
      <div class="pack">
        <h2>Mala inteligente</h2>

        <p>
          Esta lista não é fixa: adapta-se ao destino, às datas,
          à meteorologia disponível, ao tipo de viagem, ao alojamento
          e às tomadas elétricas.
        </p>

        <div class="detail-grid">
          <div class="detail">
            <strong>🌡️ Temperatura</strong>
            <span>
              ${data.facts.min!==null?
                Math.round(data.facts.min)+"°C mín.":"Sem dados"} /
              ${data.facts.max!==null?
                Math.round(data.facts.max)+"°C máx.":"Sem dados"}
            </span>
          </div>

          <div class="detail">
            <strong>🌧️ Chuva</strong>
            <span>
              ${data.facts.rain!==null?
                "até "+Math.round(data.facts.rain)+"%":"Sem dados"}
            </span>
          </div>

          <div class="detail">

            <span>${escapeHTML(data.facts.plug||"Confirmar")}</span>
          </div>

          <div class="detail">
            <strong>📅 Duração</strong>
            <span>${data.facts.days} dia(s)</span>
          </div>
        </div>

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin:20px 0">
          <button class="secondary" onclick="packAll()">✓ Adicionar tudo</button>
          <button class="secondary" onclick="clearPacking()">Limpar</button>
          <button class="secondary" onclick="addCustomPackingItem()">＋ Adicionar item</button>
        </div>

        <div class="pack-list">
          ${data.items.map(item=>{
            const checked=!!saved[item.id];

            return `
              <label class="pack-item">
                <input type="checkbox"
                       ${checked?"checked":""}
                       onchange="togglePackItem('${item.id}',this.checked)">
                <span>
                  <strong>${item.icon} ${escapeHTML(item.name)}</strong>
                  <small>${escapeHTML(item.reason)}</small>
                </span>
              </label>`;
          }).join("")}
        </div>
      </div>
    `
  );
}

function togglePackItem(id,value){
  const saved=getPackingState();
  saved[id]=value;
  savePackingState(saved);
  openPacking();
}

function packAll(){
  const data=getPackingRecommendations();
  const saved={};

  data.items.forEach(item=>saved[item.id]=true);
  savePackingState(saved);
  openPacking();
}

function clearPacking(){
  savePackingState({});
  openPacking();
}

function addCustomPackingItem(){
  const name=prompt("O que queres adicionar à mala?");

  if(!name?.trim()) return;

  const id="custom-"+Date.now();
  const custom=JSON.parse(localStorage.getItem(APP_KEY+":custom-pack")||"[]");

  custom.push({
    id,
    name:name.trim()
  });

  localStorage.setItem(
    APP_KEY+":custom-pack",
    JSON.stringify(custom)
  );

  openPacking();
}

    `
  );
}

function openEmergency(){
  const number=EMERGENCY[state.destination?.cc]||"Número não confirmado";

  openModal(
    "🚨 Emergências",
    `
      <div class="detail">
        <strong>Números disponíveis</strong>
        <span style="font-size:22px">${escapeHTML(number)}</span>
      </div>

      <p>
        Confirma localmente os números de emergência do destino.
        Em caso de emergência, procura também assistência local imediata.
      </p>
    `
  );
}

function openCapital(){
  openModal(
    "🏛️ Capital",
    `
      <div class="detail">
        <strong>Capital nacional</strong>
        <span>${escapeHTML(state.destinationMeta?.capital||"Não disponível")}</span>
      </div>
    `
  );
}

function openLanguage(){
  const m=state.destinationMeta||{};
  const cc=state.destination?.cc;
  const pack=LANGUAGE_PACKS[cc];

  const languages=m.languages||pack?.names||[];

  let html=`
    <p>
      Língua(s) indicada(s) para o país:
      <strong>${escapeHTML(languages.join(", ")||"Consultar")}</strong>
    </p>`;

  if(pack){
    html+=`
      <div class="detail-grid">
        ${pack.phrases.map(p=>`
          <div class="detail">
            <strong>${escapeHTML(p[0])}</strong>
            <span>${escapeHTML(p[1])}</span>
            <div style="margin-top:9px">
              <button class="secondary"
                      onclick='speakPhrase(${JSON.stringify(p[1])},"${cc}")'>
                🔊 Ouvir
              </button>
              <button class="secondary"
                      onclick='copyText(${JSON.stringify(p[1])})'>
                📋 Copiar
              </button>
            </div>
          </div>
        `).join("")}
      </div>`;
  }else{
    html+=`
      <p>
        O país tem dados de língua disponíveis, mas esta aplicação
        ainda não tem um guia de pronúncia personalizado para essa língua.
      </p>`;
  }

  openModal("🗣️ Língua e frases úteis",html);
}

function speakPhrase(text,cc){
  if(!("speechSynthesis" in window)){
    alert("O teu navegador não disponibiliza leitura de texto.");
    return;
  }

  const utterance=new SpeechSynthesisUtterance(text);

  const langs={
    PT:"pt-PT",FR:"fr-FR",IT:"it-IT",ES:"es-ES",
    DE:"de-DE",GB:"en-GB",JP:"ja-JP",GR:"el-GR",
    TR:"tr-TR",NL:"nl-NL"
  };

  utterance.lang=langs[cc]||"en-US";
  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    alert("Frase copiada.");
  }catch{
    alert(text);
  }
}

function openLocalTime(){
  const tz=
    state.weather[0]?.timezone||
    state.destinationMeta?.timezones?.[0];

  if(!tz){
    openModal("🕐 Hora local","<p>Não foi possível confirmar o fuso horário deste destino.</p>");
    return;
  }

  openModal(
    "🕐 Hora local agora",
    `
      <div style="font-size:48px;font-weight:900;text-align:center"
           id="localClock">${formatLocalTime(tz)}</div>

      <p style="text-align:center;color:var(--muted)">
        ${escapeHTML(formatLocalDate(tz))}
      </p>
    `
  );

  const timer=setInterval(()=>{
    const el=document.getElementById("localClock");
    if(!el){
      clearInterval(timer);
      return;
    }

    el.textContent=formatLocalTime(tz);
  },1000);
}

function formatLocalTime(timeZone){
  return new Intl.DateTimeFormat("pt-PT",{
    timeZone,
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit",
    hour12:false
  }).format(new Date());
}

function formatLocalDate(timeZone){
  return new Intl.DateTimeFormat("pt-PT",{
    timeZone,
    weekday:"long",
    day:"2-digit",
    month:"long",
    year:"numeric"
  }).format(new Date());
}

/* ============================================================
   FLIGHTS / LODGING
============================================================ */

  const d=state.destination;

  const query=[
    d.name,
    d.country,
    state.planner.start||"",
    state.planner.end||""

function searchHotels(){

}

function searchHostels(){

}

function searchApartments(){

}

function openTravelSearch(query){

    `https://www.google.com/travel/search?q=${encodeURIComponent(query)}`,

    "noopener"

/* ============================================================
   MAP
============================================================ */

function openMap(){

  window.open(
    `https://www.google.com/maps/search/?api=1&query=${d.lat},${d.lon}`,
    "_blank",

}

function openTravelMode(){
  if(!state.destination){
    alert("Escolhe primeiro um destino.");
    return;
  }

  const d=state.destination;
  const weather=state.weather[0];

  openModal(
    "✈️ Modo Viagem",
    `
      <div class="destination-header" style="min-height:300px">
        <img src="${escapeHTML(
          state.destinationImage||
          placeholderDestinationSVG(d.name)
        )}" alt="${escapeHTML(d.name)}">

          <h1 style="font-size:50px">${escapeHTML(d.name)}</h1>

              ""}

      <div class="travel-bar">
        <button class="secondary" onclick="openMap()">🗺️ Estou aqui</button>
        <button class="secondary" onclick="openLocalTime()">🕐 Hora local</button>
        <button class="secondary" onclick="openWeatherModal()">🌦️ Tempo</button>
        <button class="secondary" onclick="openEmergency()">🚨 Emergências</button>
        <button class="secondary" onclick="searchNearby('restaurant')">🍴 Comer perto</button>
        <button class="secondary" onclick="searchNearby('cafe')">☕ Café perto</button>

function searchNearby(category){
  const d=state.destination;

  const text={
    restaurant:"restaurantes",
    cafe:"cafés",
    attraction:"atrações"
  }[category]||category;

  window.open(
    `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(text+" perto de "+d.name)}`,
    "_blank",
    "noopener"
  );
}

/* ============================================================
   PASSPORT
============================================================ */

function destinationKey(d){
  return [
    d?.name||"",
    d?.country||"",
    d?.cc||""
  ].join("|");
}

function isVisited(key){
  return state.passport.some(x=>x.key===key);
}

function toggleVisited(){
  if(!state.destination) return;

  const key=destinationKey(state.destination);
  const index=state.passport.findIndex(x=>x.key===key);

  if(index>=0){
    if(confirm("Queres remover este carimbo do Passaporte?")){
      state.passport.splice(index,1);
    }
  }else{
    state.passport.push({
      key,
      name:state.destination.name,
      country:state.destination.country,
      flag:state.destination.flag||"📍",
      date:new Date().toISOString()
    });
  }

  localStorage.setItem(
    APP_KEY+":passport",
    JSON.stringify(state.passport)
  );

  if(state.destination){
    const image=
      document.querySelector(".destination-header img")?.src||
      null;

    renderDestination(image,state.weather);
    loadAllPlaceCategories();
  }
}

function renderPassportMini(){
  if(!state.passport.length){
    return `
      <div class="empty">
        Ainda não tens carimbos.
        Abre um destino e usa “📍 Marcar como visitado”
        quando realmente o tiveres visitado.
      </div>`;
  }

  return `
    <div class="passport">
      <div class="eyebrow">${state.passport.length} CARIMBO(S)</div>
      <h2>As tuas viagens.</h2>

      <div class="stamps">
        ${state.passport.slice(-6).map(stamp=>`
          <div class="stamp">
            ${stamp.flag}<br>
            <strong>${escapeHTML(stamp.name)}</strong>
          </div>
        `).join("")}
      </div>
    </div>`;
}

function openPassport(){
  openModal(
    "🎟️ O teu Passaporte",
    `
      <div class="passport">
        <div class="eyebrow">ESCAPADINHA</div>
        <h2>${state.passport.length} destino(s) visitado(s)</h2>

        <p>
          Um destino só recebe carimbo quando o marcas
          explicitamente como visitado.
        </p>

        <div class="stamps">
          ${
            state.passport.length?
            state.passport.map(stamp=>`
              <div class="stamp">
                ${stamp.flag}<br>
                <strong>${escapeHTML(stamp.name)}</strong>
                <br>
                <small>
                  ${new Date(stamp.date).toLocaleDateString("pt-PT")}
                </small>
              </div>
            `).join(""):
            `<div style="opacity:.7">Ainda sem carimbos.</div>`
          }
        </div>
      </div>
    `
  );
}

/* ============================================================
   FAVORITES
============================================================ */

function isFavorite(id){
  return state.favorites.some(x=>x.id===id);
}

function toggleFavorite(place){
  const index=state.favorites.findIndex(x=>x.id===place.osmId);

  if(index>=0){
    state.favorites.splice(index,1);
  }else{
    state.favorites.push({
      id:place.osmId,
      name:place.name,
      category:place.category,
      destination:state.destination?.name||""
    });
  }

  localStorage.setItem(
    APP_KEY+":favorites",
    JSON.stringify(state.favorites)
  );

  alert(index>=0?"Removido dos favoritos.":"Guardado nos favoritos.");
}

/* ============================================================
   RANDOM DESTINATIONS
============================================================ */

function surpriseMe(){
  const d=DESTINATIONS[
    Math.floor(Math.random()*DESTINATIONS.length)
  ];

  openDestinationByName(DESTINATIONS.indexOf(d));
}

function randomFromType(type){
  const groups={
    praia:["Funchal","Nice","Barcelona","Miami","Sydney","Auckland"],
    natureza:["Funchal","Vancouver","Auckland","Edimburgo","Quioto"],
    gastronomia:["Lisboa","Porto","Roma","Paris","Banguecoque","Istambul"],
    cultura:["Roma","Paris","Viena","Praga","Atenas","Quioto"],
    aventura:["Funchal","Vancouver","Auckland","Istambul"],
    romantica:["Paris","Veneza","Roma","Nice","Praga"]
  };

  const names=groups[type]||DESTINATIONS.map(d=>d[0]);
  const name=names[Math.floor(Math.random()*names.length)];
  const index=DESTINATIONS.findIndex(d=>d[0]===name);

  if(index>=0) openDestinationByName(index);
}

/* ============================================================
   MODAL
============================================================ */

function openModal(title,body){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=body;
  document.getElementById("modal").classList.add("open");
}

function closeModal(event){
  if(event && event.target!==event.currentTarget) return;
  document.getElementById("modal").classList.remove("open");
}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    document.getElementById("modal").classList.remove("open");
  }
});

/* Datas razoáveis para o planner */
(function initDates(){
  const start=document.getElementById("startDate");
  const end=document.getElementById("endDate");

  if(!start||!end) return;

  const today=new Date();
  const later=new Date(today);
  later.setDate(later.getDate()+3);

  start.value=today.toISOString().slice(0,10);
  end.value=later.toISOString().slice(0,10);
})();
</script>
