<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorar Destinos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.25rem;
      margin-bottom: 0.5rem;
      color: #38bdf8;
    }

    header p {
      color: #94a3b8;
    }

    /* Filter Buttons */
    .filter-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .filter-btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      background: #1e293b;
      padding: 1rem;
      border-radius: 0.75rem;
      margin-bottom: 2rem;
      border: 1px solid #334155;
    }

    .stat-item span {
      font-weight: bold;
      color: #38bdf8;
    }

    /* Destination Grid */
    .destination-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .destination-card {
      background: #1e293b;
      border-radius: 0.75rem;
      overflow: hidden;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .destination-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .destination-image {
      height: 180px;
      width: 100%;
      overflow: hidden;
      background: #334155;
      position: relative;
    }

    .destination-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .destination-card:hover .destination-image img {
      transform: scale(1.05);
    }

    .destination-content {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .destination-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
    }

    .flag {
      font-size: 1.25rem;
    }

    .destination-content h3 {
      font-size: 1.25rem;
      color: #f1f5f9;
    }

    .country-name {
      color: #38bdf8;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: block;
    }

    .description {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    /* Card Action Buttons */
    .card-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .small-btn {
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 0.4rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
    }

    .small-btn:hover {
      background: #334155;
    }

    .small-btn.active-fav {
      background: #881337;
      border-color: #f43f5e;
      color: #fecdd3;
    }

    .small-btn.active-visited {
      background: #064e3b;
      border-color: #10b981;
      color: #a7f3d0;
    }

    .small-btn.explore-btn {
      margin-left: auto;
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }

    .small-btn.explore-btn:hover {
      background: #0369a1;
    }

    /* Simple Detail Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 1000;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: #1e293b;
      border-radius: 0.75rem;
      max-width: 500px;
      width: 100%;
      overflow: hidden;
      border: 1px solid #334155;
    }

    .modal-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .modal-body {
      padding: 1.5rem;
    }

    .modal-body h2 {
      margin-bottom: 0.25rem;
      color: #38bdf8;
    }

    .modal-body p {
      color: #94a3b8;
      margin-top: 0.75rem;
    }

    .modal-close {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.6rem;
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
    }

    .modal-close:hover {
      background: #475569;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🌎 Explorar Destinos</h1>
      <p>Escolhe uma cidade para começar a tua próxima viagem.</p>
    </header>

    <!-- Region Filters -->
    <div class="filter-container" id="filterContainer">
      <button class="filter-btn active" onclick="filterRegion('Todos', this)">Todos</button>
      <button class="filter-btn" onclick="filterRegion('Europa', this)">Europa</button>
      <button class="filter-btn" onclick="filterRegion('Ásia', this)">Ásia</button>
      <button class="filter-btn" onclick="filterRegion('América', this)">América</button>
      <button class="filter-btn" onclick="filterRegion('África', this)">África</button>
      <button class="filter-btn" onclick="filterRegion('Oceânia', this)">Oceânia</button>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-item">Favoritos: <span id="favCount">0</span></div>
      <div class="stat-item">Visitados: <span id="visitedCount">0</span></div>
    </div>

    <!-- Destination Cards Grid -->
    <div class="destination-grid" id="destinationGrid"></div>
  </div>

  <!-- Detail Modal -->
  <div class="modal" id="exploreModal">
    <div class="modal-content">
      <img id="modalImg" class="modal-image" src="" alt="" />
      <div class="modal-body">
        <h2 id="modalTitle"></h2>
        <strong id="modalCountry" class="country-name"></strong>
        <p id="modalDesc"></p>
        <button class="modal-close" onclick="closeModal()">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    // Complete destination dataset with high-quality photo links
    const destinations = [
      { name: "Lisboa", flag: "🇵🇹", country: "Portugal", region: "Europa", image: "https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?q=80&w=800&auto=format&fit=crop", description: "História, miradouros, comida e mar." },
      { name: "Porto", flag: "🇵🇹", country: "Portugal", region: "Europa", image: "https://images.unsplash.com/photo-1555881400-74d7acaacd8b?q=80&w=800&auto=format&fit=crop", description: "Ribeira, vinho e arquitetura." },
      { name: "Madrid", flag: "🇪🇸", country: "Espanha", region: "Europa", image: "https://images.unsplash.com/photo-1539037116277-4db20889f2d4?q=80&w=800&auto=format&fit=crop", description: "Museus, parques e gastronomia." },
      { name: "Barcelona", flag: "🇪🇸", country: "Espanha", region: "Europa", image: "https://images.unsplash.com/photo-1583422409516-2895a77efded?q=80&w=800&auto=format&fit=crop", description: "Gaudí, praia e vida urbana." },
      { name: "Paris", flag: "🇫🇷", country: "França", region: "Europa", image: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=800&auto=format&fit=crop", description: "Arte, cultura e gastronomia." },
      { name: "Roma", flag: "🇮🇹", country: "Itália", region: "Europa", image: "https://images.unsplash.com/photo-1552832230-c0197dd311b5?q=80&w=800&auto=format&fit=crop", description: "História, monumentos e comida." },
      { name: "Londres", flag: "🇬🇧", country: "Reino Unido", region: "Europa", image: "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?q=80&w=800&auto=format&fit=crop", description: "Museus, história e bairros." },
      { name: "Amesterdão", flag: "🇳🇱", country: "Países Baixos", region: "Europa", image: "https://images.unsplash.com/photo-1512470876302-972faa2aa9a4?q=80&w=800&auto=format&fit=crop", description: "Canais, bicicletas e arte." },
      { name: "Praga", flag: "🇨🇿", country: "Chéquia", region: "Europa", image: "https://images.unsplash.com/photo-1519671482749-fd09be7ccebf?q=80&w=800&auto=format&fit=crop", description: "Centro histórico e arquitetura." },
      { name: "Reiquiavique", flag: "🇮🇸", country: "Islândia", region: "Europa", image: "https://images.unsplash.com/photo-1529963183134-61a90db47eaf?q=80&w=800&auto=format&fit=crop", description: "Natureza, vulcões e auroras." },
      { name: "Atenas", flag: "🇬🇷", country: "Grécia", region: "Europa", image: "https://images.unsplash.com/photo-1603565816030-6b389eeb23cb?q=80&w=800&auto=format&fit=crop", description: "Antiguidade, ilhas e gastronomia." },
      { name: "Istambul", flag: "🇹🇷", country: "Turquia", region: "Europa", image: "https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?q=80&w=800&auto=format&fit=crop", description: "Dois continentes numa só cidade." },
      { name: "Tóquio", flag: "🇯🇵", country: "Japão", region: "Ásia", image: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?q=80&w=800&auto=format&fit=crop", description: "Tecnologia, cultura e gastronomia." },
      { name: "Seul", flag: "🇰🇷", country: "Coreia do Sul", region: "Ásia", image: "https://images.unsplash.com/photo-1538485399081-7191377e8241?q=80&w=800&auto=format&fit=crop", description: "Tecnologia, tradição e cultura pop." },
      { name: "Banguecoque", flag: "🇹🇭", country: "Tailândia", region: "Ásia", image: "https://images.unsplash.com/photo-1508009603885-50cf7c579365?q=80&w=800&auto=format&fit=crop", description: "Templos, mercados e comida." },
      { name: "Bali", flag: "🇮🇩", country: "Indonésia", region: "Ásia", image: "https://images.unsplash.com/photo-1537996194471-e657df975ab4?q=80&w=800&auto=format&fit=crop", description: "Praias, templos e natureza." },
      { name: "Dubai", flag: "🇦🇪", country: "Emirados Árabes Unidos", region: "Ásia", image: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?q=80&w=800&auto=format&fit=crop", description: "Arquitetura, luxo e deserto." },
      { name: "Nova Iorque", flag: "🇺🇸", country: "Estados Unidos", region: "América", image: "https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?q=80&w=800&auto=format&fit=crop", description: "Arranha-céus, museus e bairros." },
      { name: "Cidade do México", flag: "🇲🇽", country: "México", region: "América", image: "https://images.unsplash.com/photo-1512813195386-6cf811ad3542?q=80&w=800&auto=format&fit=crop", description: "História, arte e gastronomia." },
      { name: "Buenos Aires", flag: "🇦🇷", country: "Argentina", region: "América", image: "https://images.unsplash.com/photo-1589909202802-8f4aadce1849?q=80&w=800&auto=format&fit=crop", description: "Cultura, tango e gastronomia." },
      { name: "Marrakech", flag: "🇲🇦", country: "Marrocos", region: "África", image: "https://images.unsplash.com/photo-1597212618440-806262de4f6b?q=80&w=800&auto=format&fit=crop", description: "Medina, mercados e cultura." },
      { name: "Cidade do Cabo", flag: "🇿🇦", country: "África do Sul", region: "África", image: "https://images.unsplash.com/photo-1580619305218-8148a1a5b804?q=80&w=800&auto=format&fit=crop", description: "Montanhas, oceano e natureza." },
      { name: "Sydney", flag: "🇦🇺", country: "Austrália", region: "Oceânia", image: "https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?q=80&w=800&auto=format&fit=crop", description: "Praias, cidade e natureza." },
      { name: "Auckland", flag: "🇳🇿", country: "Nova Zelândia", region: "Oceânia", image: "https://images.unsplash.com/photo-1507699622108-4be3abd695ad?q=80&w=800&auto=format&fit=crop", description: "Vulcões, mar e paisagens." }
    ];

    // Local Storage State
    let favorites = JSON.parse(localStorage.getItem('favDestinations')) || [];
    let visited = JSON.parse(localStorage.getItem('visitedDestinations')) || [];
    let currentRegion = 'Todos';

    // Utilities to prevent XSS string injection issues
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeJs(str) {
      return String(str).replace(/'/g, "\\'");
    }

    // Render Cards
    function renderDestinations(list = destinations) {
      const grid = document.getElementById("destinationGrid");

      const filteredList = currentRegion === 'Todos' 
        ? list 
        : list.filter(item => item.region === currentRegion);

      grid.innerHTML = filteredList.map(item => {
        const isFav = favorites.includes(item.name);
        const isVis = visited.includes(item.name);

        return `
          <article class="destination-card">
            <div class="destination-image">
              <img 
                src="${escapeHtml(item.image)}" 
                alt="${escapeHtml(item.name)}" 
                loading="lazy" 
              />
            </div>

            <div class="destination-content">
              <div class="destination-header">
                <span class="flag">${escapeHtml(item.flag)}</span>
                <h3>${escapeHtml(item.name)}</h3>
              </div>
              <strong class="country-name">${escapeHtml(item.country)}</strong>
              <p class="description">${escapeHtml(item.description)}</p>

              <div class="card-buttons">
                <button
                  class="small-btn ${isFav ? "active-fav" : ""}"
                  onclick="toggleFavorite('${escapeJs(item.name)}')"
                >
                  ${isFav ? "❤️" : "🤍"}
                </button>

                <button
                  class="small-btn ${isVis ? "active-visited" : ""}"
                  onclick="toggleVisited('${escapeJs(item.name)}')"
                >
                  ${isVis ? "✓ Visitado" : "📍 Visitei"}
                </button>

                <button
                  class="small-btn explore-btn"
                  onclick="exploreDestination('${escapeJs(item.name)}')"
                >
                  Explorar
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("");

      updateStats();
    }

    // Filter Logic
    function filterRegion(region, btnElement) {
      currentRegion = region;
      
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');

      renderDestinations();
    }

    // Favorites & Visited Toggles
    function toggleFavorite(cityName) {
      if (favorites.includes(cityName)) {
        favorites = favorites.filter(name => name !== cityName);
      } else {
        favorites.push(cityName);
      }
      localStorage.setItem('favDestinations', JSON.stringify(favorites));
      renderDestinations();
    }

    function toggleVisited(cityName) {
      if (visited.includes(cityName)) {
        visited = visited.filter(name => name !== cityName);
      } else {
        visited.push(cityName);
      }
      localStorage.setItem('visitedDestinations', JSON.stringify(visited));
      renderDestinations();
    }

    // Update Stats
    function updateStats() {
      document.getElementById('favCount').textContent = favorites.length;
      document.getElementById('visitedCount').textContent = visited.length;
    }

    // Modal Explorer Logic
    function exploreDestination(cityName) {
      const dest = destinations.find(d => d.name === cityName);
      if (!dest) return;

      document.getElementById('modalImg').src = dest.image;
      document.getElementById('modalImg').alt = dest.name;
      document.getElementById('modalTitle').textContent = `${dest.flag} ${dest.name}`;
      document.getElementById('modalCountry').textContent = `${dest.country} (${dest.region})`;
      document.getElementById('modalDesc').textContent = dest.description;

      document.getElementById('exploreModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('exploreModal').classList.remove('open');
    }

    // Initial render on page load
    document.addEventListener("DOMContentLoaded", () => {
      renderDestinations();
    });
  </script>
</body>
</html>
