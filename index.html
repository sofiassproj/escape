```html
<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escapadinha ✈️ — Planeador de Viagens</title>

<style>
:root{
  --bg:#f6f8fc;
  --card:#fff;
  --text:#172033;
  --muted:#667085;
  --primary:#635bff;
  --primary2:#8b5cf6;
  --border:#e7eaf0;
  --success:#16a34a;
  --danger:#dc2626;
  --shadow:0 12px 35px rgba(30,41,59,.09);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

header{
  background:
    linear-gradient(135deg,rgba(35,25,85,.92),rgba(99,91,255,.9)),
    url("https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1800&q=80")
    center/cover;
  color:white;
  padding:70px 20px 100px;
}

.nav{
  max-width:1180px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:25px;
  font-weight:900;
}

.nav a{
  color:white;
  text-decoration:none;
  margin-left:18px;
  font-weight:700;
  opacity:.95;
}

.hero{
  max-width:1180px;
  margin:65px auto 0;
}

.hero h1{
  font-size:clamp(40px,7vw,76px);
  line-height:.98;
  max-width:850px;
  margin:0 0 20px;
}

.hero p{
  max-width:680px;
  font-size:20px;
  line-height:1.6;
  opacity:.92;
}

.container{
  max-width:1180px;
  margin:-50px auto 70px;
  padding:0 20px;
  position:relative;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:var(--shadow);
  padding:25px;
  margin-bottom:25px;
}

.planner{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  align-items:end;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:13px;
  font-weight:800;
  margin-bottom:7px;
}

.field input,
.field select{
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:13px;
  outline:none;
  background:white;
}

.field input:focus,
.field select:focus{
  border-color:var(--primary);
}

.btn{
  border:0;
  border-radius:13px;
  padding:14px 18px;
  font-weight:800;
  background:var(--primary);
  color:white;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
  filter:brightness(.97);
}

.btn.secondary{
  background:#eef0ff;
  color:#5148d8;
}

.btn.green{
  background:var(--success);
}

.bt
